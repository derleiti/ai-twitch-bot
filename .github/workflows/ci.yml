name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install check dependencies
        run: |
          python -m pip install --upgrade pip
          grep -Ei '^(fastapi|requests|python-dotenv|authlib|pyjwt|httpx|itsdangerous)(\[crypto\])?==' requirements.txt > /tmp/zephyr-ci-requirements.txt
          python -m pip install pytest ruff -r /tmp/zephyr-ci-requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q *.py auth tests zephyr
      - name: Critical Ruff checks
        run: ruff check *.py auth tests zephyr --select E9,F63,F7,F82
      - name: Tests
        run: |
          python -m pytest -q tests
